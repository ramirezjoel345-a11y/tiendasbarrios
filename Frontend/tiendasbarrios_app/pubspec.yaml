name: tiendasbarrios_app
description: "App de TiendasBarrios para tenderos y vecinos."
publish_to: 'none' # private, no publicar en pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Íconos estilo iOS
  cupertino_icons: ^1.0.8

  # HTTP Client
  dio: ^5.4.0

  # Estado
  provider: ^6.1.5+1

  # Almacenamiento local (guardar token JWT)
  shared_preferences: ^2.5.3

  # Animaciones de carga
  flutter_spinkit: ^5.2.0

  # Mapas de Google
  google_maps_flutter: ^2.7.0

  # Websockets para chat en tiempo real
  socket_io_client: ^2.0.3+1
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
