<!doctype html><meta charset="utf-8">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<div>
  <input id="token" placeholder="Bearer <ACCESS>" style="width: 600px;">
  <input id="store" placeholder="storeId">
  <button id="join">Join</button>
  <input id="msg" placeholder="mensaje">
  <button id="send">Send</button>
  <pre id="log"></pre>
</div>
<script>
let socket; const log=x=>document.getElementById('log').textContent+=x+"\n";
document.getElementById('join').onclick=()=>{
  const t=document.getElementById('token').value.trim();
  const storeId=document.getElementById('store').value.trim();
  socket=io("http://localhost:4000",{auth:{token:t}});
  socket.on('connect',()=>log('connected'));
  socket.on('store:joined',d=>log('joined '+d.storeId));
  socket.on('store:message',d=>log('msg: '+d.message.content+' by '+d.message.author.name));
  socket.emit('store:join',{storeId});
};
document.getElementById('send').onclick=()=>{
  const storeId=document.getElementById('store').value.trim();
  const content=document.getElementById('msg').value;
  socket.emit('store:message',{storeId,content});
};
</script>
